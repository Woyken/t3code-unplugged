name: Release auto-fix

# React to a failed Release workflow. The release preflight already checks the
# patch series before every build, so this workflow does not run on a timer.
#
# It repairs two kinds of drift in the same flow:
#   patch: the series no longer applies or verify-strip fails
#   build: the series applies, but a build or publish step no longer matches
#          upstream's commands, workflow assumptions, or helper scripts
#
# Each result is validated in a clean checkout and published as a regular PR.
# Nothing is auto-merged and the agents never receive a GitHub write token.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Upstream stable tag to check (default: from the failed run or newest)"
        required: false
        type: string
      run_id:
        description: "Failed Release run ID (default: latest failed run, if any)"
        required: false
        type: string
      dry_run:
        description: "Run the fixer and agent-side checks, but skip clean validation and the PR"
        required: false
        default: false
        type: boolean
      force:
        description: "Run the fixer even if an open PR or a previous failed attempt exists"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-auto-fix
  cancel-in-progress: false

jobs:
  detect:
    name: Detect drift
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: |
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      tag: ${{ steps.run.outputs.tag }}
      base: ${{ steps.run.outputs.base }}
      run_url: ${{ steps.run.outputs.run_url }}
      failed_jobs: ${{ steps.run.outputs.failed_jobs }}
      failed_patch: ${{ steps.check.outputs.failed_patch }}
      branch: ${{ steps.existing.outputs.branch }}
      label: ${{ steps.existing.outputs.label }}
      title: ${{ steps.existing.outputs.title }}
      existing_pr: ${{ steps.existing.outputs.url }}
      fix_attempted: ${{ steps.existing.outputs.attempted }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve failed release
        id: run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.upstream_tag }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail

          run_id="${INPUT_RUN_ID:-${EVENT_RUN_ID:-}}"
          run_url="${EVENT_RUN_URL:-}"
          run_json='{}'
          failed_jobs=""
          build_failure=false

          if [[ -z "${run_id}" ]]; then
            run_id="$(gh run list --workflow=release.yml --status=failure --limit 1 \
              --json databaseId --jq '.[0].databaseId // empty')"
          fi

          if [[ -n "${run_id}" ]]; then
            if [[ -z "${run_url}" ]]; then
              run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
            fi
            run_json="$(gh run view "${run_id}" --json conclusion,jobs)"
            conclusion="$(printf '%s' "${run_json}" | jq -r '.conclusion // ""')"
            if [[ "${conclusion}" == "failure" ]]; then
              failed_jobs="$(printf '%s' "${run_json}" \
                | jq -r '.jobs[] | select(.conclusion == "failure") | .name')"

              while IFS= read -r job; do
                case "${job}" in
                  ""|"Resolve upstream tag"|"Verify patch series"|"Close resolved drift issue")
                    ;;
                  *)
                    build_failure=true
                    ;;
                esac
              done <<< "${failed_jobs}"
            fi
          fi

          tag="${INPUT_TAG:-}"
          if [[ -z "${tag}" && -n "${run_id}" ]]; then
            resolve_job_id="$(printf '%s' "${run_json}" \
              | jq -r '.jobs[]? | select(.name == "Resolve upstream tag") | .databaseId' \
              | head -n 1)"
            if [[ -n "${resolve_job_id}" ]]; then
              tag="$(gh run view --job "${resolve_job_id}" --log 2>/dev/null \
                | sed -E 's/\x1B\[[0-9;]*[mGKHF]//g' \
                | sed -n 's/.*Releasing \(v[0-9][0-9.]*\) as .*/\1/p' \
                | tail -n 1 || true)"
            fi
          fi
          if [[ -z "${tag}" ]]; then
            tag="$(git ls-remote --tags --refs https://github.com/pingdotgg/t3code.git 'v*' \
              | awk '{print $2}' \
              | sed 's#^refs/tags/##' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -n 1)"
          fi
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'${tag}' is not a stable tag like v1.2.3" >&2
            exit 1
          fi

          base="$(cat upstream-base.txt)"
          mkdir -p fix-input
          printf '%s\n' "${failed_jobs}" > fix-input/failed-jobs.txt

          if [[ "${build_failure}" == "true" ]]; then
            {
              echo "Release run: ${run_url}"
              echo "Upstream tag: ${tag}"
              echo "Previous base: ${base}"
              echo
              echo "## Failed jobs"
              printf '%s\n' "${failed_jobs}"
            } > fix-input/failure.log

            while IFS=$'\t' read -r job_id job_name; do
              {
                echo
                echo "### ${job_name}"
              } >> fix-input/failure.log
              gh run view --job "${job_id}" --log-failed 2>&1 \
                | sed -E 's/\x1B\[[0-9;]*[mGKHF]//g' \
                | tail -n 300 >> fix-input/failure.log || true
            done < <(printf '%s' "${run_json}" \
              | jq -r '.jobs[] | select(.conclusion == "failure") | [.databaseId, .name] | @tsv')

            if [[ "$(wc -c < fix-input/failure.log)" -gt 200000 ]]; then
              tail -c 200000 fix-input/failure.log > fix-input/failure.log.tmp
              mv fix-input/failure.log.tmp fix-input/failure.log
            fi
          fi

          {
            echo "tag=${tag}"
            echo "base=${base}"
            echo "run_url=${run_url}"
            echo "build_failure=${build_failure}"
            echo "failed_jobs<<EOF"
            printf '%s\n' "${failed_jobs}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Resolved ${tag} (base ${base}); build failure: ${build_failure}."

      - uses: actions/checkout@v4
        with:
          repository: pingdotgg/t3code
          ref: ${{ steps.run.outputs.tag }}
          path: upstream
          fetch-depth: 1

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: upstream/package.json
          cache: false
          run-install: false

      - name: Apply series, verify strip, and typecheck
        id: check
        shell: bash
        run: |
          set -uo pipefail
          shopt -s nullglob

          mkdir -p fix-input/rejects
          failed=false
          failed_patch=""
          : > fix-input/apply.log

          patches=(patches/*.patch)
          if (( ${#patches[@]} == 0 )); then
            echo "::error::No patches found in patches/."
            exit 1
          fi

          for patch in "${patches[@]}"; do
            name="$(basename "${patch}")"
            patch_path="$(realpath "${patch}")"
            echo "applying ${name}" | tee -a fix-input/apply.log
            if ! git -C upstream apply --reject --whitespace=nowarn "${patch_path}" 2>&1 | tee -a fix-input/apply.log; then
              failed=true
              failed_patch="${name}"
              break
            fi
          done

          if [[ "${failed}" == "false" ]]; then
            if ! bash scripts/verify-strip.sh upstream 2>&1 | tee -a fix-input/apply.log; then
              failed=true
              failed_patch="verify-strip"
            fi
          fi

          # The series can apply and still reference symbols upstream removed.
          if [[ "${failed}" == "false" ]]; then
            if ! bash scripts/typecheck-patches.sh upstream 2>&1 | tee -a fix-input/apply.log; then
              failed=true
              failed_patch="typecheck"
            fi
          fi

          if [[ "${failed}" == "true" ]]; then
            while IFS= read -r rej; do
              dest="fix-input/rejects/$(printf '%s' "${rej#upstream/}" | tr '/' '_')"
              cp "${rej}" "${dest}"
            done < <(find upstream -name '*.rej' -type f)
            echo "failed=true" >> "$GITHUB_OUTPUT"
            echo "failed_patch=${failed_patch}" >> "$GITHUB_OUTPUT"
            echo "::warning::Patch series failed on ${{ steps.run.outputs.tag }} (${failed_patch})."
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
            echo "failed_patch=" >> "$GITHUB_OUTPUT"
            echo "Patch series applies, is stripped, and typechecks on ${{ steps.run.outputs.tag }}."
          fi

      - name: Classify drift
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.check.outputs.failed }}" == "true" ]]; then
            mode=patch
          elif [[ "${{ steps.run.outputs.build_failure }}" == "true" ]]; then
            mode=build
          else
            mode=none
          fi
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
          case "${mode}" in
            patch) echo "Patch drift detected (a patch, verify-strip, or typecheck failed)." ;;
            build) echo "Build drift detected; patch series applies and typechecks." ;;
            none) echo "No drift detected." ;;
          esac

      - name: Check for an existing PR or previous attempt
        id: existing
        if: steps.classify.outputs.mode != 'none'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MODE: ${{ steps.classify.outputs.mode }}
          TAG: ${{ steps.run.outputs.tag }}
        run: |
          set -euo pipefail

          case "${MODE}" in
            patch)
              branch="patch-fix/${TAG}"
              label="patch-drift"
              title="Patch drift: ${TAG}"
              marker="<!-- ai-fix-attempted: ${TAG} -->"
              ;;
            build)
              branch="build-fix/${TAG}"
              label="release-drift"
              title="Release build drift: ${TAG}"
              marker="<!-- ai-release-fix-attempted: ${TAG} -->"
              ;;
            *)
              echo "::error::Unknown mode '${MODE}'."
              exit 1
              ;;
          esac

          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          echo "label=${label}" >> "$GITHUB_OUTPUT"
          echo "title=${title}" >> "$GITHUB_OUTPUT"

          url="$(gh pr list --head "${branch}" --state open --json url --jq '.[0].url // empty' || true)"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          if [[ -n "${url}" ]]; then
            echo "Open fix PR already exists: ${url}"
          fi

          issues_json="$(gh issue list --state open --label "${label}" --limit 100 \
            --json number,title,body 2>/dev/null || echo '[]')"
          attempted=false
          if printf '%s' "${issues_json}" | jq -e \
            --arg title "${title}" \
            --arg marker "${marker}" \
            '[.[] | select(.title == $title and ((.body // "") | contains($marker)))] | length > 0' \
            >/dev/null; then
            attempted=true
            echo "A previous AI fix for ${TAG} did not produce a PR."
          fi
          echo "attempted=${attempted}" >> "$GITHUB_OUTPUT"

      - name: Upload failure details
        if: steps.classify.outputs.mode != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: drift-fix-input
          path: fix-input
          if-no-files-found: ignore

  fix:
    name: Fix ${{ needs.detect.outputs.mode }} drift
    needs: detect
    if: |
      needs.detect.outputs.mode != 'none' &&
      (needs.detect.outputs.existing_pr == '' ||
       (github.event_name == 'workflow_dispatch' && inputs.force == true)) &&
      (needs.detect.outputs.fix_attempted != 'true' ||
       (github.event_name == 'workflow_dispatch' && inputs.force == true))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    environment: autoFixer
    env:
      MODE: ${{ needs.detect.outputs.mode }}
      TAG: ${{ needs.detect.outputs.tag }}
      BASE: ${{ needs.detect.outputs.base }}
      RUN_URL: ${{ needs.detect.outputs.run_url }}
      # Bump deliberately; the workflow installs this exact OpenCode V2 version.
      OPENCODE_VERSION: "2.2.0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download failure details
        uses: actions/download-artifact@v4
        with:
          name: drift-fix-input
          path: fix-input

      - name: Checkout upstream
        shell: bash
        run: |
          set -euo pipefail
          # Clone without the checkout action so it does not try to clean up
          # submodules from upstream's broken .gitmodules, and so no GitHub
          # credentials are persisted into the throwaway tree.
          git clone --depth 1 --branch "${TAG}" \
            https://github.com/pingdotgg/t3code.git upstream
          if [[ "${BASE}" != "${TAG}" ]]; then
            git -C upstream fetch --depth 1 origin "refs/tags/${BASE}:refs/tags/${BASE}"
          fi
          git -C upstream tag --list "${BASE}" "${TAG}"

          if [[ "${MODE}" == "build" ]]; then
            bash scripts/apply-patches.sh upstream
          fi

      - name: Render prompt
        id: prompt
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${MODE}" == "patch" ]]; then
            agent="patch-fixer"
            template=".github/prompts/patch-fixer.md"
          else
            agent="release-fixer"
            template=".github/prompts/release-fixer.md"
          fi
          sed -e "s/{{TAG}}/${TAG}/g" \
              -e "s/{{BASE}}/${BASE}/g" \
              -e "s#{{RUN_URL}}#${RUN_URL}#g" \
              "${template}" > fix-input/prompt.md
          echo "agent=${agent}" >> "$GITHUB_OUTPUT"

      - name: Install OpenCode
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://opencode.ai/v2/install | bash -s -- \
            --version "${OPENCODE_VERSION}" --no-modify-path
          "$HOME/.opencode/bin/opencode" --version

      - name: Run drift fixer
        shell: bash
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${OPENCODE_API_KEY:-}" ]]; then
            echo "::error::OPENCODE_API_KEY is not set. Add it as an Actions secret."
            exit 1
          fi
          "$HOME/.opencode/bin/opencode" --standalone --print-logs run \
            --agent "${{ steps.prompt.outputs.agent }}" \
            --model "opencode/deepseek-v4.1-flash-free#high" \
            --auto \
            "$(cat fix-input/prompt.md)" 2>&1 | tee fix-input/opencode.log

      - name: Redact secret from logs
        if: always()
        shell: bash
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${OPENCODE_API_KEY:-}" ]]; then
            exit 0
          fi
          if [[ -f fix-input/opencode.log ]] && grep -qF -- "${OPENCODE_API_KEY}" fix-input/opencode.log; then
            echo "[redacted: the log contained the API key]" > fix-input/opencode.log
            echo "::warning::Redacted the API key from the OpenCode log."
          fi
          if grep -rqF -- "${OPENCODE_API_KEY}" \
            patches .github/workflows/release.yml scripts README.md fix-input/prompt.md 2>/dev/null; then
            echo "::error::The fixer wrote the API key into the repository files or prompt."
            exit 1
          fi

      # Re-check the agent's edits before handing anything to the publish job.
      # The publish job repeats validation from a clean checkout; this step just
      # rejects obvious mistakes and builds the reviewable diff.
      - name: Validate agent edits
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${MODE}" == "patch" ]]; then
            git add -A -- patches upstream-base.txt

            unexpected="$(
              { git diff --name-only; git diff --cached --name-only; git ls-files --others --exclude-standard; } \
                | sort -u \
                | grep -vE '^(patches/|upstream-base\.txt$)' \
                | grep -vE '^(upstream$|upstream/|fix-input$|fix-input/)' \
                || true
            )"
            if [[ -n "${unexpected}" ]]; then
              echo "::error::The fixer changed paths outside patches/ and upstream-base.txt:"
              echo "${unexpected}"
              exit 1
            fi

            if [[ "$(cat upstream-base.txt)" != "${TAG}" ]]; then
              echo "::error::upstream-base.txt was not updated to ${TAG}."
              exit 1
            fi

            if [[ -z "$(git diff --cached --name-only)" ]]; then
              echo "::error::The fixer made no changes."
              exit 1
            fi

            git diff --cached --binary -- patches upstream-base.txt > fix-input/proposed.diff
            git diff --cached --stat -- patches upstream-base.txt > fix-input/proposed-stat.txt
            git diff --cached --name-only -- patches upstream-base.txt > fix-input/changed-files.txt
          else
            git add -A -- .github/workflows/release.yml scripts README.md

            unexpected="$(
              { git diff --name-only; git diff --cached --name-only; git ls-files --others --exclude-standard; } \
                | sort -u \
                | grep -vE '^(\.github/workflows/release\.yml|README\.md|scripts/.+)$' \
                | grep -vE '^(upstream$|upstream/|fix-input$|fix-input/)' \
                || true
            )"
            if [[ -n "${unexpected}" ]]; then
              echo "::error::The fixer changed paths outside the release files:"
              echo "${unexpected}"
              exit 1
            fi

            if [[ -z "$(git diff --cached --name-only)" ]]; then
              echo "::error::The fixer made no changes. The failure may not be build drift."
              exit 1
            fi

            git diff --cached --binary -- .github/workflows/release.yml scripts README.md \
              > fix-input/proposed.diff
            git diff --cached --stat -- .github/workflows/release.yml scripts README.md \
              > fix-input/proposed-stat.txt
            git diff --cached --name-only -- .github/workflows/release.yml scripts README.md \
              > fix-input/changed-files.txt
          fi
          cat fix-input/changed-files.txt

      - name: Upload proposed fix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-fix-proposal
          path: fix-input
          if-no-files-found: ignore

  publish:
    name: Validate and open PR
    needs: [detect, fix]
    if: |
      needs.fix.result == 'success' &&
      inputs.dry_run != true &&
      (needs.detect.outputs.existing_pr == '' ||
       (github.event_name == 'workflow_dispatch' && inputs.force == true))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr_url: ${{ steps.pr.outputs.url }}
    env:
      MODE: ${{ needs.detect.outputs.mode }}
      TAG: ${{ needs.detect.outputs.tag }}
      BASE: ${{ needs.detect.outputs.base }}
      BRANCH: ${{ needs.detect.outputs.branch }}
      FAILED_JOBS: ${{ needs.detect.outputs.failed_jobs }}
      RELEASE_RUN_URL: ${{ needs.detect.outputs.run_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download proposed fix
        uses: actions/download-artifact@v4
        with:
          name: drift-fix-proposal
          path: ${{ runner.temp }}/drift-proposal

      - uses: voidzero-dev/setup-vp@v1
        with:
          cache: false
          run-install: false

      - name: Apply and validate diff
        shell: bash
        env:
          PROPOSAL: ${{ runner.temp }}/drift-proposal
          # check-patches.sh clones a throwaway tree, so this installs and
          # typechecks there and discards it afterwards.
          T3CODE_PATCH_TYPECHECK: "1"
        run: |
          set -euo pipefail
          test -s "${PROPOSAL}/proposed.diff"
          git apply --check "${PROPOSAL}/proposed.diff"
          git apply "${PROPOSAL}/proposed.diff"

          changed="$(
            { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u
          )"

          if [[ "${MODE}" == "patch" ]]; then
            bad="$(printf '%s\n' "${changed}" \
              | grep -vE '^(patches/|upstream-base\.txt$)' \
              | grep -v '^$' || true)"
            if [[ -n "${bad}" ]]; then
              echo "::error::Proposed fix touches disallowed paths:"
              echo "${bad}"
              exit 1
            fi
            if [[ "$(cat upstream-base.txt)" != "${TAG}" ]]; then
              echo "::error::upstream-base.txt is not ${TAG}."
              exit 1
            fi
          else
            bad="$(printf '%s\n' "${changed}" \
              | grep -vE '^(\.github/workflows/release\.yml|README\.md|scripts/.+)$' \
              | grep -v '^$' || true)"
            if [[ -n "${bad}" ]]; then
              echo "::error::Proposed fix touches disallowed paths:"
              echo "${bad}"
              exit 1
            fi
            for script in scripts/*.sh; do
              bash -n "${script}"
            done
            ruby -ryaml -e 'ARGV.each { |path| YAML.load_file(path) }' .github/workflows/*.yml
          fi

          ./scripts/check-patches.sh "${TAG}"

      - name: Commit and push branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${BRANCH}"

          if [[ "${MODE}" == "patch" ]]; then
            git add -A -- patches upstream-base.txt
            message="Refresh unplugged patches for ${TAG}"
          else
            git add -A -- .github/workflows/release.yml scripts README.md
            message="Repair release build for ${TAG}"
          fi

          git commit -m "${message}"
          git push --force origin "HEAD:refs/heads/${BRANCH}"

      - name: Create or update PR
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          PROPOSAL: ${{ runner.temp }}/drift-proposal
        run: |
          set -euo pipefail

          if [[ -n "${RELEASE_RUN_URL}" ]]; then
            trigger="Failed Release run: ${RELEASE_RUN_URL}"
          else
            trigger="Manual run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi

          if [[ "${MODE}" == "patch" ]]; then
            title="Refresh unplugged patches for ${TAG}"
            validation="- \`./scripts/check-patches.sh ${TAG}\` passed in a clean checkout (apply, \`verify-strip\`, and \`tsc\`).
          - The proposed diff only touches \`patches/\` and \`upstream-base.txt\`."
          else
            title="Repair release build for ${TAG}"
            validation="- \`bash -n\` passed for every script in \`scripts/\`.
          - Every workflow file parses as YAML.
          - \`./scripts/check-patches.sh ${TAG}\` passed in a clean checkout (apply, \`verify-strip\`, and \`tsc\`).
          - The proposed diff only touches \`.github/workflows/release.yml\`, \`scripts/\`, and \`README.md\`."
          fi

          cat > "${PROPOSAL}/pr-body.md" <<EOF
          ## Automated release repair

          Upstream tag: \`${TAG}\`
          Previous base: \`${BASE}\`
          Failure: ${trigger}
          Model: \`opencode/deepseek-v4.1-flash-free#high\`

          ### Failed jobs

          $(printf '%s\n' "${FAILED_JOBS}" | sed 's/^/- /')

          ### Validation

          ${validation}

          ### Diff stat

          \`\`\`
          $(cat "${PROPOSAL}/proposed-stat.txt")
          \`\`\`

          ### Review

          This PR was generated by an AI agent. ${MODE} drift can change build or patch inputs, so review the diff for semantic or security changes before merging. CI and \`verify-strip\` passing does not prove the change is benign.
          EOF

          url="$(gh pr list --head "${BRANCH}" --state open --json url --jq '.[0].url // empty')"
          if [[ -n "${url}" ]]; then
            gh pr edit "${url}" --body-file "${PROPOSAL}/pr-body.md"
            echo "url=${url}" >> "$GITHUB_OUTPUT"
            echo "Updated existing PR: ${url}"
            exit 0
          fi

          url="$(gh pr create \
            --base "${BASE_BRANCH:-main}" \
            --head "${BRANCH}" \
            --title "${title}" \
            --body-file "${PROPOSAL}/pr-body.md")"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "Opened PR: ${url}"

  report:
    name: Report drift
    needs: [detect, fix, publish]
    if: always() && needs.detect.outputs.mode != 'none' && needs.detect.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      MODE: ${{ needs.detect.outputs.mode }}
      TAG: ${{ needs.detect.outputs.tag }}
      BASE: ${{ needs.detect.outputs.base }}
      LABEL: ${{ needs.detect.outputs.label }}
      TITLE: ${{ needs.detect.outputs.title }}
      FAILED_JOBS: ${{ needs.detect.outputs.failed_jobs }}
      FAILED_PATCH: ${{ needs.detect.outputs.failed_patch }}
      EXISTING_PR: ${{ needs.detect.outputs.existing_pr }}
      FIX_ATTEMPTED: ${{ needs.detect.outputs.fix_attempted }}
      FIX_RESULT: ${{ needs.fix.result }}
      PUBLISH_RESULT: ${{ needs.publish.result }}
      PR_URL: ${{ needs.publish.outputs.pr_url }}
      RELEASE_RUN_URL: ${{ needs.detect.outputs.run_url }}
      DRY_RUN: ${{ inputs.dry_run }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Update drift issue
        shell: bash
        run: |
          set -euo pipefail

          case "${MODE}" in
            patch)
              color="FBCA04"
              description="Patch series no longer applies to upstream"
              marker="<!-- ai-fix-attempted: ${TAG} -->"
              ;;
            build)
              color="D93F0B"
              description="Release build no longer matches upstream"
              marker="<!-- ai-release-fix-attempted: ${TAG} -->"
              ;;
            *)
              echo "Unknown mode '${MODE}'; not updating an issue."
              exit 0
              ;;
          esac

          gh label create "${LABEL}" \
            --color "${color}" \
            --description "${description}" 2>/dev/null || true

          issues_json="$(gh issue list --state open --label "${LABEL}" --limit 100 \
            --json number,title 2>/dev/null || echo '[]')"
          issue_number="$(printf '%s' "${issues_json}" \
            | jq --arg title "${TITLE}" \
                '[.[] | select(.title == $title) | .number][0] // empty')"

          if [[ -n "${PR_URL}" ]]; then
            status="PR opened: ${PR_URL}"
          elif [[ "${DRY_RUN}" == "true" && "${FIX_RESULT}" == "success" ]]; then
            status="Fix validated in dry-run mode; no PR was opened."
          elif [[ -n "${EXISTING_PR}" ]]; then
            status="An open fix PR already exists: ${EXISTING_PR}"
          elif [[ "${FIX_ATTEMPTED}" == "true" && "${FIX_RESULT}" == "skipped" ]]; then
            status="A previous AI attempt did not produce a PR; rerun with force or fix manually."
          elif [[ "${FIX_RESULT}" == "failure" ]]; then
            status="The AI fixer failed or made no changes; see the workflow run logs."
          elif [[ "${PUBLISH_RESULT}" == "failure" ]]; then
            status="The proposed fix failed clean validation; no PR was opened."
          else
            status="Drift detected; no fix was produced."
          fi

          if [[ -n "${PR_URL}" ]]; then
            body_marker=""
          elif [[ "${FIX_RESULT}" == "failure" || "${PUBLISH_RESULT}" == "failure" || "${FIX_ATTEMPTED}" == "true" ]]; then
            body_marker="${marker}"
          else
            body_marker=""
          fi

          if [[ "${MODE}" == "patch" ]]; then
            {
              echo "Upstream tag \`${TAG}\` no longer applies, verifies, or typechecks against the unplugged series."
              echo
              echo "- Previous base: \`${BASE}\`"
              echo "- Failed patch: \`${FAILED_PATCH:-unknown}\`"
              echo "- Status: ${status}"
              echo "- Workflow run: ${RUN_URL}"
            } > "${RUNNER_TEMP}/drift.md"
          else
            {
              echo "Release run ${RELEASE_RUN_URL} failed for upstream \`${TAG}\` while the patch series applied, verified, and typechecked."
              echo
              echo "- Failed jobs:"
              printf '%s\n' "${FAILED_JOBS}" | sed 's/^/  - /'
              echo "- Status: ${status}"
              echo "- Workflow run: ${RUN_URL}"
              echo "- Previous base: \`${BASE}\`"
            } > "${RUNNER_TEMP}/drift.md"
          fi

          {
            echo
            if [[ "${MODE}" == "patch" ]]; then
              echo "The hourly release will keep failing until this is fixed or the patch series is refreshed."
            else
              echo "The hourly release will keep failing until the build steps are updated."
            fi
            echo
            echo "${body_marker}"
          } >> "${RUNNER_TEMP}/drift.md"

          if [[ -n "${issue_number}" ]]; then
            gh issue edit "${issue_number}" --body-file "${RUNNER_TEMP}/drift.md"
            echo "Updated issue #${issue_number}"
          else
            gh issue create \
              --title "${TITLE}" \
              --label "${LABEL}" \
              --body-file "${RUNNER_TEMP}/drift.md"
          fi
