name: Release

on:
  schedule:
    # Upstream stable tags are picked up within the hour.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Upstream stable tag to build (default: newest)"
        required: false
        type: string
      force:
        description: "Build even if this upstream tag already has a release"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: unplugged-release
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve upstream tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      should_build: ${{ steps.resolve.outputs.should_build }}
      upstream_tag: ${{ steps.resolve.outputs.upstream_tag }}
      version: ${{ steps.resolve.outputs.version }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag and version
        id: resolve
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.upstream_tag }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          if [[ -n "${INPUT_TAG}" ]]; then
            upstream_tag="${INPUT_TAG}"
          else
            upstream_tag="$(git ls-remote --tags --refs https://github.com/pingdotgg/t3code.git 'v*' \
              | awk '{print $2}' \
              | sed 's#^refs/tags/##' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -n 1)"
          fi
          if [[ ! "${upstream_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: '${upstream_tag}' is not a stable tag like v1.2.3" >&2
            exit 1
          fi

          existing="$(git ls-remote --tags --refs origin "refs/tags/${upstream_tag}-unplugged.*" \
            | awk '{print $2}' \
            | sed 's#^refs/tags/##' \
            | sort -V \
            | tail -n 1)"

          if [[ -n "${existing}" && "${FORCE}" != "true" ]]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "release_tag=${existing}" >> "$GITHUB_OUTPUT"
            echo "Already released ${upstream_tag} as ${existing}; nothing to do."
            exit 0
          fi

          if [[ -n "${existing}" ]]; then
            last="${existing##*.}"
            next=$((last + 1))
          else
            next=1
          fi

          version="${upstream_tag#v}-unplugged.${next}"
          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "upstream_tag=${upstream_tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release_tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${upstream_tag} as v${version}."

  preflight:
    name: Verify patch series
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: pingdotgg/t3code
          ref: ${{ needs.resolve.outputs.upstream_tag }}
          path: upstream
          fetch-depth: 1

      - name: Apply unplugged patch series
        run: bash scripts/apply-patches.sh upstream

      - name: Verify unplugged strip
        run: bash scripts/verify-strip.sh upstream

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: upstream/package.json
          cache: false
          run-install: false

      # Catching this before any platform build keeps a patch that references a
      # symbol upstream removed from ever producing an artifact.
      - name: Typecheck patched packages
        run: bash scripts/typecheck-patches.sh upstream

  linux-cli:
    name: Linux CLI ${{ matrix.arch }}
    needs: [resolve, preflight]
    if: needs.resolve.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: pingdotgg/t3code
          ref: ${{ needs.resolve.outputs.upstream_tag }}
          path: upstream
          fetch-depth: 1

      - name: Apply unplugged patch series
        shell: bash
        run: bash scripts/apply-patches.sh upstream

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: upstream/package.json
          cache: false
          run-install: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: upstream
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/scripts...

      - name: Align package versions
        working-directory: upstream
        run: node scripts/update-release-package-versions.ts "${{ needs.resolve.outputs.version }}"

      - name: Build server bundle and web client
        working-directory: upstream
        run: vp run --filter t3 build

      - name: Pin patched dependencies for the CLI archive
        working-directory: upstream
        shell: bash
        run: bash ../scripts/pin-patched-dependencies.sh pnpm-workspace.yaml

      # Build natively on the matching runner. Upstream's cross-target list
      # excludes linux-arm64 (its SEA output must load on 16/64 KiB page
      # kernels), and a native build works for both architectures. Let setup-vp
      # pick the package.json Node version; overriding it breaks the native check.
      - name: Build CLI executable
        working-directory: upstream
        run: node apps/server/scripts/cli.ts build-exe

      - name: Build resource monitor
        working-directory: upstream
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml

      - name: Stage resource monitor
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/cli-resource-monitor/linux-${{ matrix.arch }}"
          mkdir -p "$stage"
          cp upstream/native/resource-monitor/target/release/t3-resource-monitor "$stage/"

      - name: Build CLI archive
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          time timeout -k 30 600 node scripts/build-cli-archive.ts \
            --platform linux \
            --arch ${{ matrix.arch }} \
            --version "${{ needs.resolve.outputs.version }}" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" \
            --output-dir release-cli
          ls -lh release-cli/

      - name: Upload CLI archive
        uses: actions/upload-artifact@v4
        with:
          name: cli-linux-${{ matrix.arch }}
          path: upstream/release-cli/*
          if-no-files-found: error

      # Upstream's smoke script has no cap on the first process it launches and
      # Effect's SIGTERM handling can keep it alive past `timeout`. Do the same
      # checks here with hard kill deadlines. This gate blocks the release: a
      # packaged CLI that does not answer requests is never publishable, and a
      # failure goes to the release fixer as build drift.
      - name: Smoke-test CLI archive
        working-directory: upstream
        shell: bash
        timeout-minutes: 6
        run: |
          set -uo pipefail
          dir="$RUNNER_TEMP/cli-smoke"
          rm -rf "$dir"
          mkdir -p "$dir/home"
          tar -xzf release-cli/*.tar.gz -C "$dir"
          root="$(find "$dir" -maxdepth 1 -mindepth 1 -type d -name 't3-*' | head -n 1)"
          if [[ -z "$root" ]]; then
            echo "::error::The CLI archive did not contain a t3-* directory."
            exit 1
          fi
          echo "archive root: $root"

          pid=""
          cleanup() {
            if [[ -n "${pid}" ]]; then
              kill -TERM "$pid" 2>/dev/null || true
              sleep 3
              kill -KILL "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          version_out="$(timeout -k 10 60 env HOME="$dir/home" T3CODE_HOME="$dir/home" "$root/t3" --version 2>&1)"
          version_status=$?
          echo "t3 --version (exit $version_status): $version_out"
          if [[ $version_status -ne 0 || "$version_out" != *"${{ needs.resolve.outputs.version }}"* ]]; then
            echo "::error::t3 --version failed or printed the wrong version."
            exit 1
          fi

          port=47811
          env HOME="$dir/home" T3CODE_HOME="$dir/home" "$root/t3" serve \
            --host 127.0.0.1 --port "$port" --no-browser >"$dir/server.log" 2>&1 &
          pid=$!
          ready=0
          exited=0
          for _ in $(seq 1 60); do
            if curl --max-time 2 -fsS "http://127.0.0.1:$port/" >/dev/null 2>&1; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              exited=1
              break
            fi
            sleep 1
          done

          cleanup
          pid=""
          tail -n 60 "$dir/server.log" || true
          if [[ $ready -ne 1 ]]; then
            if [[ $exited -eq 1 ]]; then
              echo "::error::t3 serve exited before answering on port $port."
            else
              echo "::error::t3 serve did not answer on port $port within 60s."
            fi
            exit 1
          fi
          echo "CLI archive smoke test passed."

  windows-desktop:
    name: Windows desktop
    needs: [resolve, preflight, linux-cli]
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: pingdotgg/t3code
          ref: ${{ needs.resolve.outputs.upstream_tag }}
          path: upstream
          fetch-depth: 1

      - name: Apply unplugged patch series
        shell: bash
        run: bash scripts/apply-patches.sh upstream

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: upstream/package.json
          cache: false
          run-install: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        working-directory: upstream
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Download Linux CLI archive for WSL
        uses: actions/download-artifact@v4
        with:
          name: cli-linux-x64
          path: upstream/release-cli

      - name: Align package versions
        working-directory: upstream
        run: node scripts/update-release-package-versions.ts "${{ needs.resolve.outputs.version }}"

      - name: Pin patched dependencies for the desktop sidecar
        working-directory: upstream
        shell: bash
        run: bash ../scripts/pin-patched-dependencies.sh pnpm-workspace.yaml

      - name: Build Windows installer
        working-directory: upstream
        shell: bash
        env:
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          wsl_archive="$(ls release-cli/t3-*.tar.gz | head -n 1)"
          node scripts/build-desktop-artifact.ts \
            --platform win \
            --target nsis \
            --arch x64 \
            --build-version "${{ needs.resolve.outputs.version }}" \
            --output-dir release \
            --wsl-runtime "$wsl_archive"

      - name: Collect installer and updater metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          installer="$(ls upstream/release/*.exe | head -n 1)"
          test -n "$installer"
          manifest="upstream/release/latest.yml"
          blockmap="${installer}.blockmap"
          test -f "$manifest"
          test -f "$blockmap"
          # electron-updater downloads the URL in latest.yml verbatim, so the
          # installer has to keep the name electron-builder gave it.
          grep -Fq "url: $(basename "$installer")" "$manifest"
          cp "$installer" artifact/
          cp "$manifest" artifact/
          cp "$blockmap" artifact/
          ls -lh artifact/

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: artifact/*
          if-no-files-found: error

  android-apk:
    name: Android APK
    needs: [resolve, preflight]
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      APP_VARIANT: production
      EXPO_NO_GIT_STATUS: "1"
      EXPO_NO_DOTENV: "1"
      CI: "1"
      GRADLE_OPTS: "-Xmx6g -Dorg.gradle.daemon=false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: pingdotgg/t3code
          ref: ${{ needs.resolve.outputs.upstream_tag }}
          path: upstream
          fetch-depth: 1

      - name: Apply unplugged patch series
        shell: bash
        run: bash scripts/apply-patches.sh upstream

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: upstream/package.json
          cache: false
          run-install: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        working-directory: upstream
        run: vp install --filter=@t3tools/mobile...

      - name: Generate Android project
        working-directory: upstream/apps/mobile
        run: node node_modules/expo/bin/cli prebuild --clean --platform android --no-install

      - name: Build release APK
        working-directory: upstream/apps/mobile/android
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            echo "Gradle build attempt $attempt"
            if ./gradlew :app:assembleRelease --no-daemon; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 30
          done

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          apk="$(find upstream/apps/mobile/android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          test -n "$apk"
          cp "$apk" "artifact/t3code-unplugged-${{ needs.resolve.outputs.version }}-android.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: artifact/*.apk
          if-no-files-found: error

  release:
    name: Publish release
    needs: [resolve, linux-cli, windows-desktop, android-apk]
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        working-directory: artifacts
        run: |
          set -euo pipefail
          test -f latest.yml
          installer="$(sed -n 's/^  - url: //p' latest.yml | head -n 1)"
          test -n "$installer"
          test -f "$installer"
          test -f "$installer.blockmap"
          sha256sum * > SHA256SUMS

      - name: Fetch upstream release notes
        shell: bash
        env:
          UPSTREAM_TAG: ${{ needs.resolve.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          # The desktop updater reads the GitHub release body as the update
          # changelog. Fetch the notes GitHub generated for the upstream tag so
          # the update prompt lists the same changes as an official install.
          # The workflow token is scoped to this repository, so stay anonymous.
          api_url="https://api.github.com/repos/pingdotgg/t3code/releases/tags/${UPSTREAM_TAG}"
          : > upstream-notes.md
          for attempt in $(seq 1 6); do
            if curl --fail --silent --show-error --location --max-time 30 \
              -H "Accept: application/vnd.github+json" \
              -H "User-Agent: t3code-unplugged-release" \
              "$api_url" -o upstream-release.json; then
              jq -r '.body // empty' upstream-release.json > upstream-notes.md
              if [[ -s upstream-notes.md ]]; then
                echo "Fetched release notes for ${UPSTREAM_TAG}."
                exit 0
              fi
            fi
            echo "::warning::Upstream release notes for ${UPSTREAM_TAG} are not available yet (attempt ${attempt}/6)."
            sleep 10
          done
          : > upstream-notes.md
          echo "::warning::Publishing without upstream release notes; see https://github.com/pingdotgg/t3code/releases/tag/${UPSTREAM_TAG}."

      - name: Write release notes
        shell: bash
        env:
          UPSTREAM_TAG: ${{ needs.resolve.outputs.upstream_tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail

          # GitHub caps release bodies at 125,000 characters and the largest
          # upstream changelog already sits near that limit, so leave room for
          # the footer and trim at a line boundary.
          max_upstream_bytes=118000
          if [[ -s upstream-notes.md ]]; then
            if [[ "$(wc -c < upstream-notes.md)" -gt "${max_upstream_bytes}" ]]; then
              # Generated notes list the oldest change first. Keep the newest
              # lines that fit so the update popover still shows recent changes.
              python3 - "${max_upstream_bytes}" <<'PY'
          import sys

          limit = int(sys.argv[1])
          with open("upstream-notes.md", encoding="utf-8") as source:
              lines = source.read().splitlines()

          kept = []
          size = 0
          for line in reversed(lines):
              line_size = len(f"{line}\n".encode())
              if size + line_size > limit:
                  break
              kept.append(line)
              size += line_size
          kept.reverse()

          header = (
              "## What's Changed\n\n"
              "_Older changes omitted for GitHub's release body limit; see the full changelog below._\n\n"
          )
          with open("notes.md", "w", encoding="utf-8") as target:
              target.write(header + "\n".join(kept) + "\n")
          PY
            else
              cp upstream-notes.md notes.md
            fi
          else
            cat > notes.md <<EOF
          ## Upstream changes

          Upstream release notes were not available when this build was published.
          EOF
          fi

          # "Full Changelog" makes the desktop release-notes parser stop before
          # the unplugged footer, so the popover only lists real changes.
          cat >> notes.md <<EOF

          ## Full Changelog

          [View the full ${UPSTREAM_TAG} changelog on GitHub](https://github.com/pingdotgg/t3code/releases/tag/${UPSTREAM_TAG}). The list above is trimmed to GitHub's release body limit when it is too long.

          ## About this unplugged build

          Built from [pingdotgg/t3code ${UPSTREAM_TAG}](https://github.com/pingdotgg/t3code/tree/${UPSTREAM_TAG}) plus the unplugged patch series. T3 Connect, product analytics, relay tracing, and OpenTelemetry export are removed; local/LAN/Tailscale access and all provider and editor features are kept. Windows builds are unsigned (SmartScreen may warn) and the Android APK uses the debug keystore. Windows installs check this repository's releases for updates; Linux and Android update manually.
          EOF

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.release_tag }}
          name: T3 Code Unplugged ${{ needs.resolve.outputs.version }}
          body_path: notes.md
          files: artifacts/*
          make_latest: true

  close-drift-issue:
    name: Close resolved drift issues
    needs: [resolve, release]
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      UPSTREAM_TAG: ${{ needs.resolve.outputs.upstream_tag }}
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
    steps:
      - name: Close matching drift issues
        shell: bash
        run: |
          set -euo pipefail
          gh label create patch-drift \
            --color FBCA04 \
            --description "Patch series no longer applies to upstream" 2>/dev/null || true
          gh label create release-drift \
            --color D93F0B \
            --description "Release build no longer matches upstream" 2>/dev/null || true

          for label in patch-drift release-drift; do
            case "${label}" in
              patch-drift) title="Patch drift: ${UPSTREAM_TAG}" ;;
              release-drift) title="Release build drift: ${UPSTREAM_TAG}" ;;
            esac
            issue_number="$(gh issue list --state open --label "${label}" --limit 100 \
              --json number,title \
              | jq --arg title "${title}" \
                  '[.[] | select(.title == $title) | .number][0] // empty')"
            if [[ -n "${issue_number}" ]]; then
              gh issue close "${issue_number}" \
                --comment "Release ${RELEASE_TAG} was published successfully for \`${UPSTREAM_TAG}\`."
            fi
          done
